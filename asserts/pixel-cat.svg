<svg xmlns="http://www.w3.org/2000/svg" width="48" height="20" viewBox="0 0 48 20" shape-rendering="crispEdges">
  <!-- Two 24 × 20 frames: open eyes / closed eyes. All coordinates are whole pixels. -->
  <defs>
    <g id="cat">
      <!-- Stepped silhouette, upright ears; no strokes, curves or gradients. -->
      <path fill="#222222" d="M3 1H6V2H7V3H8V4H16V3H17V2H18V1H21V8H22V13H21V15H19V16H5V15H3V13H2V8H3Z"/>
      <path fill="#8A8A86" d="M4 3H5V4H6V5H8V5H16V5H18V4H19V3H20V9H21V12H20V14H18V15H6V14H4V12H3V9H4Z"/>
      <path fill="#555555" d="M4 2H5V4H6V6H4ZM19 2H20V6H18V4H19ZM9 5H11V7H10V8H9ZM13 5H15V8H14V7H13Z"/>
      <!-- Small pale muzzle and quiet, neutral expression. -->
      <path fill="#F5F5F1" d="M10 9H14V11H16V13H15V14H9V13H8V11H10Z"/>
      <path fill="#555555" d="M11 11H13V12H12V13H11Z"/>
      <path fill="#222222" d="M11 13H13V14H11ZM0 10H3V11H0ZM1 12H4V13H1ZM21 10H24V11H21ZM20 12H23V13H20Z"/>
      <!-- Paws extend past the sill; the gap between them lets the notebook line show. -->
      <path fill="#222222" d="M5 15H8V16H9V19H8V20H4V19H3V17H4V16H5ZM16 15H19V16H20V19H19V20H15V19H14V17H15V16H16Z"/>
      <path fill="#F5F5F1" d="M5 16H7V17H8V19H4V17H5ZM16 16H18V17H19V19H15V17H16Z"/>
      <path fill="#8A8A86" d="M5 18H6V19H5ZM7 18H8V19H7ZM16 18H17V19H16ZM18 18H19V19H18Z"/>
    </g>
  </defs>
  <!-- Frame 1 -->
  <use href="#cat"/>
  <path fill="#222222" d="M7 9H9V10H8V11H7ZM15 9H17V11H16V10H15Z"/>
  <!-- Frame 2: only the eyes change. -->
  <g transform="translate(24 0)">
    <use href="#cat"/>
    <path fill="#222222" d="M7 10H9V11H7ZM15 10H17V11H15Z"/>
  </g>
</svg>
